name: lb1-batch

# The LB = 1 enumerations that are too long for a laptop on an unreliable
# mains supply.  Runs whenever this file is pushed (edit the matrix to queue
# more).  A patch is split into shards (cycles with index % k == i); each
# shard job resumes from the newest artifact of its own name, and before
# that from whatever partial log is committed under results/, so a
# cancelled, timed-out or re-pushed job never repeats a finished cycle.
# Results stay in artifacts; nothing here commits.
#
# Done (logs committed under results/): 2x2, 3x2, 4x2, 5x2 at T = 11 (all
# SAT); 3x3 at T = 11 has certified witnesses above 11 (see
# lb1.witness_7_3), so the 3x3 question is now T = 12.
#
# To combine shards after downloading their artifacts:
#   cat results/lb1_7_3_T12.s*of6.jsonl > results/lb1_7_3_T12.jsonl
#   python -m pts.lb1 7 3 12 --log=results/lb1_7_3_T12.jsonl   # verdict, 0 calls

on:
  push:
    branches: [main]
    paths: [".github/workflows/lb1-batch.yml"]

permissions:
  contents: read

# a new push supersedes the running batch (its shards have already uploaded
# whatever they finished, and the new jobs resume from those artifacts)
concurrency:
  group: lb1-batch
  cancel-in-progress: true

jobs:
  lb1:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { W: 7, Ht: 3, T: 12, shard: "0/6" }   # 3 x 3, 288 cycles, 85,062 instances, at T = 12
          - { W: 7, Ht: 3, T: 12, shard: "1/6" }
          - { W: 7, Ht: 3, T: 12, shard: "2/6" }
          - { W: 7, Ht: 3, T: 12, shard: "3/6" }
          - { W: 7, Ht: 3, T: 12, shard: "4/6" }
          - { W: 7, Ht: 3, T: 12, shard: "5/6" }
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install python-sat==1.9.dev15
      - name: names
        run: |
          TAG=$(echo "${{ matrix.shard }}" | sed 's#/#of#')
          echo "WHOLE=results/lb1_${{ matrix.W }}_${{ matrix.Ht }}_T${{ matrix.T }}.jsonl" >> $GITHUB_ENV
          echo "LOG=results/lb1_${{ matrix.W }}_${{ matrix.Ht }}_T${{ matrix.T }}.s${TAG}.jsonl" >> $GITHUB_ENV
          echo "NAME=lb1-${{ matrix.W }}-${{ matrix.Ht }}-T${{ matrix.T }}-s${TAG}" >> $GITHUB_ENV
      - name: resume from the previous run's artifact, if any
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: lb1-batch.yml
          name: ${{ env.NAME }}
          path: results
          search_artifacts: true
          if_no_artifact_found: ignore
      - name: seed from the committed whole-patch log, if the shard log is empty
        run: |
          mkdir -p results
          if [ ! -s "$LOG" ] && [ -s "$WHOLE" ]; then cp "$WHOLE" "$LOG"; fi
          echo "resuming from $(wc -l < $LOG 2>/dev/null || echo 0) finished cycles"
      - name: enumerate
        run: |
          PYTHONUNBUFFERED=1 python -m pts.lb1 ${{ matrix.W }} ${{ matrix.Ht }} ${{ matrix.T }} --shard=${{ matrix.shard }} --log=$LOG | tee results/${NAME}.txt
      - name: keep the log even if the job is cancelled or times out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.LOG }}
            results/${{ env.NAME }}.txt
          if-no-files-found: warn
