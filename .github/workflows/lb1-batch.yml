name: lb1-batch

# The LB = 1 enumerations that are too long for a laptop on an unreliable
# mains supply.  Runs whenever this file is pushed (edit the matrix to queue
# more).  A patch is split into shards (cycles with index % k == i); each
# shard job resumes from the newest artifact of its own name, and before
# that from whatever partial log is committed under results/, so a
# cancelled, timed-out or re-pushed job never repeats a finished cycle.
# Results stay in artifacts; nothing here commits.
#
# To combine shards after downloading their artifacts:
#   cat results/lb1_7_3.s*of6.jsonl > results/lb1_7_3.jsonl
#   python -m pts.lb1 7 3 11 --log=results/lb1_7_3.jsonl     # verdict, 0 calls

on:
  push:
    branches: [main]
    paths: [".github/workflows/lb1-batch.yml"]

permissions:
  contents: read

jobs:
  lb1:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { W: 9,  Ht: 2, T: 11, shard: "0/3" }   # 4 x 2, 133 cycles, 6,687 instances
          - { W: 9,  Ht: 2, T: 11, shard: "1/3" }
          - { W: 9,  Ht: 2, T: 11, shard: "2/3" }
          - { W: 7,  Ht: 3, T: 11, shard: "0/6" }   # 3 x 3, 288 cycles, 85,062 instances
          - { W: 7,  Ht: 3, T: 11, shard: "1/6" }
          - { W: 7,  Ht: 3, T: 11, shard: "2/6" }
          - { W: 7,  Ht: 3, T: 11, shard: "3/6" }
          - { W: 7,  Ht: 3, T: 11, shard: "4/6" }
          - { W: 7,  Ht: 3, T: 11, shard: "5/6" }
          - { W: 11, Ht: 2, T: 11, shard: "0/6" }   # 5 x 2, 364 cycles, 97,069 instances
          - { W: 11, Ht: 2, T: 11, shard: "1/6" }
          - { W: 11, Ht: 2, T: 11, shard: "2/6" }
          - { W: 11, Ht: 2, T: 11, shard: "3/6" }
          - { W: 11, Ht: 2, T: 11, shard: "4/6" }
          - { W: 11, Ht: 2, T: 11, shard: "5/6" }
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SHARD_TAG: s${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install python-sat==1.9.dev15
      - name: names
        run: |
          TAG=$(echo "${{ matrix.shard }}" | sed 's#/#of#')
          echo "LOG=results/lb1_${{ matrix.W }}_${{ matrix.Ht }}.s${TAG}.jsonl" >> $GITHUB_ENV
          echo "NAME=lb1-${{ matrix.W }}-${{ matrix.Ht }}-T${{ matrix.T }}-s${TAG}" >> $GITHUB_ENV
      - name: resume from the previous run's artifact, if any
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: lb1-batch.yml
          name: ${{ env.NAME }}
          path: results
          search_artifacts: true
          if_no_artifact_found: ignore
      - name: seed from the committed whole-patch log, if the shard log is empty
        run: |
          mkdir -p results
          WHOLE=results/lb1_${{ matrix.W }}_${{ matrix.Ht }}.jsonl
          if [ ! -s "$LOG" ] && [ -s "$WHOLE" ]; then cp "$WHOLE" "$LOG"; fi
          echo "resuming from $(wc -l < $LOG 2>/dev/null || echo 0) finished cycles"
      - name: enumerate
        run: |
          PYTHONUNBUFFERED=1 python -m pts.lb1 ${{ matrix.W }} ${{ matrix.Ht }} ${{ matrix.T }} --shard=${{ matrix.shard }} --log=$LOG | tee results/${NAME}.txt
      - name: keep the log even if the job is cancelled or times out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.LOG }}
            results/${{ env.NAME }}.txt
          if-no-files-found: warn
